# ==============================================================================
# Spring Boot Configuration for AI Tourism Recommendation and Itinerary Planner
# SRMU Lucknow - B.Tech CSE Project
# ==============================================================================

server.port=8080

# Application Details
spring.application.name=ai-tourism-planner

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring AI PGVector Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384

# OpenAI / LLM API Key (Can be overridden via environment variable OPENAI_API_KEY)
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3

# H2 In-Memory Fallback Profile (If PostgreSQL is not running)
# Run with: --spring.profiles.active=dev
spring.datasource.continue-on-error=true
